server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Ruta "/" : el health check del ALB y los usuarios reciben index.html.
    # OJO: aqui NO hay proxy a /api. Esa separacion la hace el ALB.
    location / {
        try_files $uri /index.html;
    }

    # No exponer la version de nginx.
    server_tokens off;
}
